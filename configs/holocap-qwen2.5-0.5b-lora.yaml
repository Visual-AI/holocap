### model
model_name_or_path: manycore-research/SpatialLM1.1-Qwen-0.5B
trust_remote_code: true
disable_gradient_checkpointing: false
use_reentrant_gc: false

### method
do_train: true
freeze_language_tower: false
freeze_point_tower: false
train_proj_only: false

### lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"          # Qwen usually used
modules_to_save: null                 # or "embed_tokens,lm_head"

### dataset
dataset: holocap_train
dataset_dir: data/holocap
template: spatiallm_qwen
num_bins: 1280
do_augmentation: false
random_rotation: false
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 2
save_dir: saves/holocap

### output
output_dir: ckpts/holocap-qwen2.5-0.5b-lora
logging_steps: 1
save_steps: 1000
overwrite_output_dir: false
save_total_limit: 5

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 5.0e-4 # to be more aggressive: try to change the learning rate to 5.0e-5 or 1.0e-4
proj_lr: 5.0e-5 
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.03
pure_bf16: false
bf16: false
fp16: false
tf32: true
ddp_timeout: 180000000
report_to: tensorboard # choices: [none, wandb, tensorboard, swanlab]
max_new_tokens: 4096

### eval
val_size: 0.0001
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 10000

